# _generated: edit tooling/ci.source.json and run pnpm generate. Do not edit by hand.
name: ci
on:
  push:
    branches:
      - master
  pull_request: {}
  schedule:
    - cron: "0 3 * * *"
    - cron: "0 4 * * 1"
concurrency:
  group: "ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}"
  cancel-in-progress: true
env:
  KEEL_AGENT: "1"
  TURBO_TOKEN: "${{ secrets.TURBO_TOKEN }}"
  TURBO_TEAM: "${{ vars.TURBO_TEAM }}"
  TURBO_CACHE_DIR: .turbo/cache
jobs:
  check:
    if: "github.event_name != 'schedule'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: "golden-2 a11y report for the ledger (keel test writes reports/a11y.json)"
        run: pnpm --filter golden-2 exec keel test
      - run: pnpm ledger --diff
      - name: every test task is in exactly one test-shard
        run: node tooling/ci-shards.mjs --verify
      - name: turbo cache for the jobs after this one
        uses: actions/cache/save@v4
        with:
          path: .turbo/cache
          key: "turbo-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}"
    timeout-minutes: 30
  test-shard:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard:
          - 1
          - 2
          - 3
          - 4
          - 5
          - 6
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: "turbo cache: the builds the check job ran"
        uses: actions/cache/restore@v4
        with:
          path: .turbo/cache
          key: "turbo-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}"
          restore-keys: "turbo-${{ github.sha }}-${{ github.run_id }}-"
      - run: "node tooling/ci-shards.mjs ${{ matrix.shard }}"
  test:
    if: "!cancelled() && github.event_name != 'schedule'"
    needs: test-shard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: every test-shard passed
        run: "test \"${{ needs.test-shard.result }}\" = success"
  postgres:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: "postgres:17"
        env:
          POSTGRES_PASSWORD: keel-ci-throwaway
        ports:
          - "5432:5432"
        options: "--health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 30"
    env:
      KEEL_TEST_POSTGRES_URL: "postgres://postgres:keel-ci-throwaway@127.0.0.1:5432/postgres"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: "std-db files that take KEEL_TEST_POSTGRES_URL, one at a time on one database"
        working-directory: packages/std-db
        run: "set -e\nfor f in conformance/driver-contract.test.ts conformance/serial-commits.test.ts conformance/layout-e2152.test.ts conformance/e2153-no-value.test.ts test/model.test.ts test/postgres-server.test.ts; do pnpm exec vitest run \"$f\"; done"
  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: "turbo cache: the builds the check job ran"
        uses: actions/cache/restore@v4
        with:
          path: .turbo/cache
          key: "turbo-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}"
          restore-keys: "turbo-${{ github.sha }}-${{ github.run_id }}-"
      - run: pnpm build
    timeout-minutes: 20
  budgets:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: "turbo cache: the builds the check job ran"
        uses: actions/cache/restore@v4
        with:
          path: .turbo/cache
          key: "turbo-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}"
          restore-keys: "turbo-${{ github.sha }}-${{ github.run_id }}-"
      - run: pnpm build
      - run: node tooling/budgets.mjs
    timeout-minutes: 20
  golden-1-images:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: "turbo cache: the builds the check job ran"
        uses: actions/cache/restore@v4
        with:
          path: .turbo/cache
          key: "turbo-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}"
          restore-keys: "turbo-${{ github.sha }}-${{ github.run_id }}-"
      - run: pnpm build
      - name: "docker build per node deployable, never pushed"
        run: "for f in apps/golden-1/deploy/*/Dockerfile; do n=$(basename \"$(dirname \"$f\")\"); docker build -f \"$f\" -t \"golden-1-$n\" apps/golden-1; done"
    timeout-minutes: 30
  mutate-pr:
    if: "github.event_name == 'pull_request'"
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache/restore@v4
        with:
          path: .git/keel-mutation
          key: "stryker-${{ github.base_ref || 'master' }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}"
          restore-keys: "stryker-${{ github.base_ref || 'master' }}-${{ github.sha }}-\nstryker-${{ github.base_ref || 'master' }}-\nstryker-master-"
      - run: node tooling/mutate-changed.mjs
      - name: "golden-2 a11y report for the ledger (keel test writes reports/a11y.json)"
        run: pnpm --filter golden-2 exec keel test
      - run: pnpm ledger --diff
      - if: "always()"
        uses: actions/cache/save@v4
        with:
          path: .git/keel-mutation
          key: "stryker-${{ github.base_ref || 'master' }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}"
    timeout-minutes: 120
  mutate:
    if: "github.event_name == 'schedule' && github.event.schedule == '0 3 * * *'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache/restore@v4
        with:
          path: .git/keel-mutation
          key: "stryker-${{ github.base_ref || 'master' }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}"
          restore-keys: "stryker-${{ github.base_ref || 'master' }}-${{ github.sha }}-\nstryker-${{ github.base_ref || 'master' }}-\nstryker-master-"
      - run: "pnpm mutate --filter=\"./packages/*\""
      - name: "golden-2 a11y report for the ledger (keel test writes reports/a11y.json)"
        run: pnpm --filter golden-2 exec keel test
      - run: pnpm ledger --diff
      - if: "always()"
        uses: actions/cache/save@v4
        with:
          path: .git/keel-mutation
          key: "stryker-${{ github.base_ref || 'master' }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}"
  eval:
    if: "github.event_name == 'schedule' && github.event.schedule == '0 4 * * 1'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: "pnpm eval --runner=none"
