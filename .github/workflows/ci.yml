name: ci
on:
  push:
    branches:
      - main
  pull_request: {}
  schedule:
    - cron: "0 3 * * *"
    - cron: "0 4 * * 1"
env:
  KEEL_AGENT: "1"
  TURBO_TOKEN: "${{ secrets.TURBO_TOKEN }}"
  TURBO_TEAM: "${{ vars.TURBO_TEAM }}"
jobs:
  check:
    if: "github.event_name != 'schedule'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
  test:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
  budgets:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: node tooling/budgets.mjs
  ledger:
    needs: budgets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm ledger --diff
  golden-1-images:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: "docker build per node deployable, never pushed"
        run: "for f in apps/golden-1/deploy/*/Dockerfile; do n=$(basename \"$(dirname \"$f\")\"); docker build -f \"$f\" -t \"golden-1-$n\" apps/golden-1; done"
  mutate-pr:
    if: "github.event_name == 'pull_request'"
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache/restore@v4
        with:
          path: .git/keel-mutation
          key: "stryker-${{ github.base_ref || 'main' }}-${{ github.sha }}"
          restore-keys: "stryker-${{ github.base_ref || 'main' }}-\nstryker-main-"
      - run: node tooling/mutate-changed.mjs
      - if: "always()"
        uses: actions/cache/save@v4
        with:
          path: .git/keel-mutation
          key: "stryker-${{ github.base_ref || 'main' }}-${{ github.sha }}"
  mutate:
    if: "github.event_name == 'schedule' && github.event.schedule == '0 3 * * *'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache/restore@v4
        with:
          path: .git/keel-mutation
          key: "stryker-${{ github.base_ref || 'main' }}-${{ github.sha }}"
          restore-keys: "stryker-${{ github.base_ref || 'main' }}-\nstryker-main-"
      - run: "pnpm mutate --filter=\"./packages/*\""
      - if: "always()"
        uses: actions/cache/save@v4
        with:
          path: .git/keel-mutation
          key: "stryker-${{ github.base_ref || 'main' }}-${{ github.sha }}"
  eval:
    if: "github.event_name == 'schedule' && github.event.schedule == '0 4 * * 1'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: "pnpm eval --runner=none"
