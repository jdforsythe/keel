name: test-macos
on:
  pull_request: {}
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: "test-macos-${{ github.ref }}"
  cancel-in-progress: true
env:
  KEEL_AGENT: "1"
jobs:
  test-macos:
    if: "github.event.repository.private == false"
    runs-on: macos-26
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard:
          - 1
          - 2
          - 3
          - 4
          - 5
          - 6
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: "node tooling/ci-shards.mjs ${{ matrix.shard }}"
